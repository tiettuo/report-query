<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>质检报告查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #333;
    font-size: 15px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center;
    height: 46px; padding: 0 14px;
    background: #3d95d5; color: #fff;
  }
  .topbar .back {
    display: flex; align-items: center; gap: 5px;
    width: 90px; cursor: pointer;
    background: none; border: none; color: inherit;
    font-family: inherit; font-size: 15px; font-weight: inherit;
    padding: 0; height: 100%;
  }
  .topbar .back svg { width: 16px; height: 16px; fill: #fff; }
  .topbar .title {
    flex: 1; text-align: center;
    font-size: 16px; font-weight: 500;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .topbar .sp { width: 90px; }

  .hint { text-align: center; color: #373739; font-size: 15px; margin: 22px 0 14px; }

  .qbox { padding: 0 16px; }
  #code {
    width: 100%; height: 40px;
    border: 1px solid #d8d8d8; border-radius: 4px;
    padding: 0 10px; font-size: 16px; color: #333; /* >=16px 避免 iOS 聚焦自动缩放 */
    background: #fff; outline: none;
  }
  #code:focus { border-color: #3d95d5; }
  #btn {
    display: block; width: 100%; height: 44px;
    margin-top: 30px;
    background: #3388cb; color: #fff;
    border: none; border-radius: 4px;
    font-size: 16px; letter-spacing: 2px; cursor: pointer;
  }
  #btn:active { background: #2b79b8; }

  .result { margin-top: 26px; }
  .row { display: flex; align-items: stretch; margin-bottom: 5px; }
  .row .lab {
    width: 30%; min-width: 108px;
    background: #9fd4f4;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 9px 10px 9px 4px;
    font-size: 15px; color: #333;
    border-radius: 2px;
  }
  .row .val {
    flex: 1; background: #fff;
    display: flex; align-items: center;
    padding: 9px 8px 9px 10px;
    font-size: 15px; color: #222;
    border-radius: 2px;
    word-break: break-all;
  }

  .none-msg { text-align: center; color: #666; font-size: 15px; margin: 40px 0; }
  #tip { text-align: center; color: #e04b3a; font-size: 13px; margin: 10px 0 0; display: none; }

  .footer {
    text-align: center; color: #333;
    font-size: 14px; line-height: 1.85;
    margin: 26px 12px 46px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="back" id="back" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8H5.7L9.9 3.8a.9.9 0 0 0 0-1.3l-.9-.9a.9.9 0 0 0-1.3 0L2 8.1l5.7 5.7a.9.9 0 0 0 1.3 0l.9-.9a.9.9 0 0 0 0-1.3L5.7 7.3h6.8a4.7 4.7 0 0 1 0 9.4H11v2h1.5a6.7 6.7 0 0 0 0-13.4z"/></svg>
      返回
    </button>
    <span class="title">质检报告查询</span>
    <span class="sp"></span>
  </div>

  <div class="qbox">
    <p class="hint">请输入质量报告编号或报告条码</p>
    <form id="qform">
      <input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="质量报告编号或报告条码">
      <button id="btn" type="submit">查 询</button>
    </form>
    <p id="tip">请先输入质量报告编号或报告条码</p>
  </div>

  <div id="result" class="result" aria-live="polite"></div>
  <p id="none" class="none-msg" style="display:none" aria-live="polite">未查询到相关报告，请核实后重新输入</p>

  <!-- 以下页脚文案照录自原系统页面（含其原文写法），非笔误 -->
  <div class="footer">
    版权(3.0)所有：国家高分子材料质量检验检测中心<br>
    （安徽）<br>
    安徽省功能高分子材料分析研究有限公司<br>
    技术支持：友胜软件（计量软件专家）
  </div>

<script>
  // 说明：本页为「自包含演示/样板查询页」，扫码后无需任何后端即可直接弹出报告，
  // 故报告数据以 base64 内嵌于前端（内容本身即为页面要展示的数据，并非敏感信息）。
  // 按 URL 参数 ?r=<编号或条码> 或手动输入匹配展示对应报告。
  var DATA_B64 = "W3sia2V5cyI6WyIyMDI2LVNMLTMwMDYiLCIyMjUwODY0MSJdLCJyb3dzIjpbWyLmiqXlkYrnvJblj7ciLCIyMDI2LVNMLTMwMDYiXSxbIuaKpeWRiuadoeeggSIsIjIyNTA4NjQxIl0sWyLns7vnu5/ljZXlj7ciLCIyMjUwODY0MSJdLFsi5bqP5Y+3IiwiMDAxIl0sWyLlp5TmiZgv5oq95qC35Y2V5Y+3IiwiLyJdLFsi5Ye66K+B6L+b5bqmIiwi5qOA5q+VIl0sWyLkvIHkuJrlkI3np7AiLCLmiJDpg73luILpu4TplK7loZHmlpnmnInpmZDlhazlj7giXSxbIuagt+WTgeWQjeensCIsIuiBmuS5meeDr+iWhOiGnCJdLFsi566h55CG57yW5Y+3IiwiLyJdXX1d";

  // 手工把 atob 得到的二进制串按 UTF-8 解码为字符串（不依赖已废弃的 escape()）。
  // 校验前置字节与后续续字节，非法字节以 U+FFFD 替换，避免异常数据输出乱码。
  function binToUtf8(bin) {
    var n = bin.length, i = 0, out = [];
    function cont(k) { return k < n ? bin.charCodeAt(k) & 0xC0 : 0; }
    while (i < n) {
      var c = bin.charCodeAt(i), cp;
      if (c < 0x80) { cp = c; i += 1; }
      else if (c >= 0xC2 && c < 0xE0 && cont(i + 1) === 0x80) {
        cp = ((c & 0x1F) << 6) | (bin.charCodeAt(i + 1) & 0x3F); i += 2;
      } else if (c >= 0xE0 && c < 0xF0 && cont(i + 1) === 0x80 && cont(i + 2) === 0x80) {
        cp = ((c & 0x0F) << 12) | ((bin.charCodeAt(i + 1) & 0x3F) << 6) | (bin.charCodeAt(i + 2) & 0x3F); i += 3;
        if (cp < 0x800) cp = 0xFFFD; // 拒绝 3 字节过度编码
      } else if (c >= 0xF0 && c <= 0xF4 && cont(i + 1) === 0x80 && cont(i + 2) === 0x80 && cont(i + 3) === 0x80) {
        cp = ((c & 0x07) << 18) | ((bin.charCodeAt(i + 1) & 0x3F) << 12) | ((bin.charCodeAt(i + 2) & 0x3F) << 6) | (bin.charCodeAt(i + 3) & 0x3F); i += 4;
        if (cp < 0x10000) cp = 0xFFFD; // 拒绝 4 字节过度编码
      } else { cp = 0xFFFD; i += 1; } // 非法前置/续字节（含 0xC0/0xC1 的 2 字节过度编码）
      if (cp > 0x10FFFF || (cp >= 0xD800 && cp <= 0xDFFF)) cp = 0xFFFD; // 越界/代理区
      if (cp > 0xFFFF) { cp -= 0x10000; out.push(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF)); }
      else out.push(cp);
    }
    var s = '', k;
    for (k = 0; k < out.length; k++) s += String.fromCharCode(out[k]);
    return s;
  }

  function bytesOf(bin) {
    var b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }

  // 优先 TextDecoder；旧 WebView 不支持时退回手工 UTF-8 解码兜底，
  // 保证扫码直达这一核心场景不因缺少现代 API 而失效
  function b64ToJson(b64) {
    var bin = atob(b64);
    var json = (typeof TextDecoder !== 'undefined')
      ? new TextDecoder('utf-8').decode(bytesOf(bin))
      : binToUtf8(bin);
    return JSON.parse(json);
  }

  // URL 参数读取：优先 URLSearchParams，缺失/异常时手动解析 location.search 兜底；
  // 两条路径均把 '+' 视为空格、并容忍畸形百分号，避免 URIError 中断初始化
  function getParam(name) {
    var raw = null;
    if (typeof URLSearchParams !== 'undefined') {
      try { return new URLSearchParams(location.search).get(name); } catch (e) { /* 落入下方兜底 */ }
    }
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&#]*)'));
    if (!m) return null;
    raw = m[1].replace(/\+/g, ' ');
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }

  var REPORTS = [];
  try { REPORTS = b64ToJson(DATA_B64); }
  catch (e) { REPORTS = []; if (typeof console !== 'undefined') console.warn('报告数据解析失败', e); }

  // 编号匹配统一转小写比较；keys 以正式大小写存储，仅用于匹配
  function findReport(key) {
    var k = String(key == null ? '' : key).trim().toLowerCase();
    if (!k) return -1;
    for (var i = 0; i < REPORTS.length; i++) {
      var keys = Array.isArray(REPORTS[i].keys) ? REPORTS[i].keys : [];
      for (var j = 0; j < keys.length; j++) {
        if (String(keys[j]).toLowerCase() === k) return i;
      }
    }
    return -1;
  }

  // 用 DOM API 构建行，避免拼接 innerHTML
  function renderReport(i) {
    var box = document.getElementById('result');
    box.innerHTML = '';
    var rows = Array.isArray(REPORTS[i].rows) ? REPORTS[i].rows : [];
    rows.forEach(function (r) {
      if (!Array.isArray(r) || r.length < 2) return; // 跳过结构异常的行
      var row = document.createElement('div'); row.className = 'row';
      var lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = String(r[0]);
      var val = document.createElement('div'); val.className = 'val'; val.textContent = String(r[1]);
      row.appendChild(lab); row.appendChild(val);
      box.appendChild(row);
    });
    box.style.display = '';
    document.getElementById('none').style.display = 'none';
  }

  function showNone() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('none').style.display = '';
  }

  function doQuery(key) {
    var tip = document.getElementById('tip');
    if (String(key).trim() === '') {
      // 空查询：提示先输入，并收起已渲染的报告与“未查询到”提示，避免同屏矛盾。
      // 不强制 focus()，避免移动端键盘反复弹出并遮挡提示，用户可自点输入框再输入
      tip.style.display = '';
      document.getElementById('result').style.display = 'none';
      document.getElementById('none').style.display = 'none';
      return;
    }
    tip.style.display = 'none';
    var i = findReport(key);
    if (i !== -1) renderReport(i); else showNone();
  }

  // 用 <form> 提交统一处理：按钮点击与 iOS 虚拟键盘“搜索/前往”键都走 submit
  document.getElementById('qform').addEventListener('submit', function (e) {
    e.preventDefault();
    doQuery(document.getElementById('code').value);
  });
  document.getElementById('back').addEventListener('click', function () {
    // 返回：有历史则回退；直接扫码打开（无历史）时尝试关闭当前查询页。
    // 本页为单页查询页，无独立入口页可跳转。部分浏览器禁止脚本关闭非脚本打开的
    // 标签页，此时 window.close() 被忽略——这是浏览器安全限制，无更优通用降级。
    if (history.length > 1) history.back(); else window.close();
  });

  // URL 携带报告标识（二维码指向 /?r=<编号或条码>）时直接展示；
  // 带参数但未命中时给出“未查询到”提示；无参数时保持初始空态，不主动提示
  var rParam = getParam('r');
  var rIdx = findReport(rParam);
  if (rIdx !== -1) renderReport(rIdx);
  else if (rParam != null && String(rParam).trim() !== '') showNone();
</script>
</body>
</html>
